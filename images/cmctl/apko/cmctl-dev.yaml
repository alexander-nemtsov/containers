# Development variant of containers-cmctl.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - cmctl
    - ca-certificates-bundle
    - busybox
    - bash
    - apk-tools
    - wget
    - curl
    - openssl
    - bind-tools
    - jq
    - git

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/cmctl

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  HOME: /tmp

annotations:
  org.opencontainers.image.title: "containers-cmctl-dev"
  org.opencontainers.image.description: "Dev variant of containers-cmctl: same cmctl + shell + curl/openssl/dig/jq/git. Not for production."
  org.opencontainers.image.url: "https://github.com/alexander-nemtsov/containers"
  org.opencontainers.image.source: "https://github.com/alexander-nemtsov/containers/tree/main/images/cmctl"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
